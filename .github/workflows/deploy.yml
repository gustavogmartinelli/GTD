name: Build and deploy

# dev    -> test, build arm64 image, deploy to the test VM
# master -> test, build arm64 image (no deploy until a prod VM exists)
#
# Rollback: open an older successful run of this workflow on dev and
# "Re-run all jobs"; it redeploys that commit's image.
on:
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/gustavogmartinelli/gtd

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cross-compiles in the Dockerfile; no QEMU needed for arm64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    needs: image
    # Set repository variable DEPLOY_ENABLED=true once the VM is ready
    # (docs/deploy/oracle-setup.md, step 9).
    if: github.ref == 'refs/heads/dev' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Joins the tailnet as an ephemeral node; the VM has no public app port.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy compose file and scripts
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          scp deploy/compose.yaml deploy/scripts/remote-deploy.sh \
              deploy/scripts/backup.sh deploy/scripts/restore.sh \
              "deploy@$HOST:/opt/gtd/"
          ssh "deploy@$HOST" 'chmod 755 /opt/gtd/*.sh'

      - name: Deploy ${{ github.sha }}
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: ssh "deploy@$HOST" "/opt/gtd/remote-deploy.sh ${{ github.sha }}"
